name: CI

# =================================================
# 검증용 워크플로우
# =================================================
# @ 가이드
# - dev / main 으로 PR 을 열거나 커밋을 추가하면 배포 가능한 빌드인지 확인한다.
# - 배포는 하지 않는다. 배포는 deploy.yml 이 main 머지(push) 때만 한다.
# @ 주의사항
# - "Verify 통과해야 머지"를 강제하려면 GitHub 저장소 설정에서 dev, main 브랜치 보호 규칙에
#   Require status checks → `Verify` 를 필수로 지정해야 한다. (워크플로우 파일만으로는 막지 못한다)
# - 잡 이름(Verify)을 바꾸면 브랜치 보호 규칙의 필수 체크도 함께 바꿔야 한다.

on:
  pull_request:
    branches:
      - main
      - dev

# 같은 PR 에 새 커밋이 오면 이전 검증은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Verify:
    runs-on: ubuntu-latest # 깃헙액션 워크플로우가 실행되는 OS 환경. EC2 OS와 같은 필요 없음
    # 통합 테스트용 Postgres. 로컬의 npm run test:db 와 같은 계정·포트(5433)라 .env.test 를 그대로 쓴다.
    # 테스트 전용 값이라 시크릿이 아니다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: moving_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: 0 # CI 에서는 git hook 설치를 건너뛴다
      # 테스트 DB 주소. prisma generate 도 이 값을 읽는다 (접속은 하지 않음)
      # test/assertTestDatabase.ts 안전장치는 localhost 의 *_test DB 만 통과시킨다
      DATABASE_URL: postgresql://postgres:password@localhost:5433/moving_test
    steps:
      - name: 깃헙 레포지토리 불러오기
        uses: actions/checkout@v4

      - name: Node 버전 고정 (EC2와 동일하게)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      # src/generated 는 git 에 없으므로 빌드 전에 생성해야 한다
      - name: Prisma Client 생성
        run: npx prisma generate --config prisma7.config.ts

      - name: 린트
        run: npm run lint

      - name: 빌드 (tsc)
        run: npm run build

      # 유닛 + 통합. 통합 테스트는 globalSetup 에서 테스트 DB 에 마이그레이션을 적용한 뒤 실행된다
      - name: 테스트
        run: npm test
